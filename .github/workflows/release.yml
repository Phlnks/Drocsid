name: Release Drocsid Electron

on:
  push:
    tags:
      - 'v*' # Se déclenche lorsqu'un tag est poussé (ex: v1.0.6)
  workflow_dispatch: # Permet de lancer manuellement depuis l'onglet Actions sur GitHub

permissions:
  contents: write # Requis pour créer et publier des Releases avec pièces jointes

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm install

      - name: Compiler le frontend (Vite)
        run: npm run build

      - name: Compiler et publier la Release Electron (Windows)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win -p always

